services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${DB_USERNAME:-quiz}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-quiz_secret}
      - POSTGRES_DB=${DB_NAME:-quiz_db}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-quiz}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
